# Render blueprint for the EVision Streamlit dashboard.
# Deploy with: https://render.com -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: evision
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
